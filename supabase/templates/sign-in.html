<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Cadence</title>
  </head>
  <body style="margin:0;padding:32px 24px;background:#ffffff;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;">
    <div style="max-width:28rem;">
      <p style="margin:0 0 24px;font-size:20px;line-height:28px;font-weight:700;">Sign in to Cadence</p>
      <p style="margin:0 0 24px;">
        <a href="{{ .SiteURL }}/login/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:10px 16px;background:#1a1a1a;color:#ffffff;font-weight:700;text-decoration:none;border-radius:6px;">Sign in</a>
      </p>
      <p style="margin:0 0 4px;">Or enter this code in Cadence:</p>
      <p style="margin:0 0 24px;font-size:28px;line-height:36px;font-weight:700;letter-spacing:4px;font-family:ui-monospace,Menlo,Consolas,monospace;">{{ .Token }}</p>
      <p style="margin:0;color:#5c5c5c;font-size:14px;line-height:20px;">The link and the code work once, for one hour. If you did not ask to sign in, you can ignore this email.</p>
    </div>
  </body>
</html>
