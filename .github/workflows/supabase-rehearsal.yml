name: Local Supabase rehearsal

on:
  pull_request:
    paths:
      - .github/workflows/supabase-rehearsal.yml
      - .github/actions/setup/**
      - supabase/**
      - scripts/supabase-rehearsal.sh
      - scripts/supabase-rehearsal-diagnostics.mjs
      - scripts/supabase-docker-proxy.mjs
      - scripts/supabase-rehearsal-integration-tests.json
      - scripts/supabase-rls-smoke.mjs
      - scripts/account-sync-rpc-smoke.mjs
      - tests/sql/**
      - tests/behavior-store-supabase.contract.test.ts
      - tests/*.local-integration.test.*
      - tests/supabase-docker-proxy.test.ts
      - tests/supabase-rehearsal-diagnostics.test.ts
      - tests/helpers/**
      - tests/fixtures/**
      - apps/desktop/src/account/canonical-json.ts
      - lib/db/**
      - lib/integrations/**
      - lib/supabase/**
      - lib/types/**
      # Services the allowlisted local integration tests import directly.
      - lib/services/behavior.service.ts
      - lib/services/behavior-change-proposals.service.ts
      - lib/services/behaviorlog*
      - lib/services/brief-move-day.service.ts
      - lib/services/brief-moves.service.ts
      - lib/services/coach-signals-job.service.ts
      - lib/services/daily-brief-agent-run.ts
      - lib/services/export.service.ts
      - lib/services/integration-behavior-input.ts
      - lib/services/integration-read-serialization.ts
      - lib/services/integration-write.service.ts
      - lib/services/oauth/**
      - lib/services/occurrence.service.ts
      - lib/services/occurrence-move.service.ts
      - lib/services/time-tracking.service.ts
      - lib/services/travel-conclusions-token.ts
      - lib/services/travel-settings.service.ts
      - lib/services/zip.ts
      - packages/core/**
      - package.json
      - package-lock.json
      - vitest.config.*
      - tsconfig.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      SUPABASE_ACCESS_TOKEN: ""
      SUPABASE_DB_PASSWORD: ""
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source identity
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            printf 'Checked commit: `%s`\n\n' "$(git rev-parse HEAD)"
            printf 'Checked tree: `%s`\n\n' "$(git rev-parse HEAD^{tree})"
            if [[ -n "$PR_HEAD_SHA" ]]; then
              printf 'PR head: `%s`\n\n' "$PR_HEAD_SHA"
              printf 'PR base: `%s`\n\n' "$PR_BASE_SHA"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Restores node_modules from the Actions cache, as the CI workflow does, and
      # runs npm ci only when a package manifest or the lockfile changed.
      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup
      - name: Verify Docker isolation and private-log diagnostics
        run: npx vitest run tests/supabase-docker-proxy.test.ts tests/supabase-rehearsal-diagnostics.test.ts
      - name: Replay migrations and run local contracts
        run: bash scripts/supabase-rehearsal.sh
