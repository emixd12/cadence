[package]
name = "cadence-desktop-spike"
version = "0.1.0"
description = "Cadence native boundary verification"
edition = "2021"
publish = false
default-run = "cadence-desktop-spike"

[features]
contract-harness = []

[[bin]]
name = "local-store-contract"
path = "src/bin/local-store-contract.rs"
required-features = ["contract-harness"]

[lib]
name = "cadence_desktop_spike"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
cc = "=1.4.0"

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-updater = "=2.14.1"
tauri-plugin-deep-link = "=2.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
chrono = "=0.4.45"
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data", "utf8_iter"] }
sha2 = "=0.10.9"

# Xcode 27.1 strip leaves release proc-macro dylibs that dyld refuses to load
# ("mis-aligned LINKEDIT string pool") when MACOSX_DEPLOYMENT_TARGET is set.
# Build scripts and proc macros never ship, so keep only them unstripped.
[profile.release.build-override]
strip = false
